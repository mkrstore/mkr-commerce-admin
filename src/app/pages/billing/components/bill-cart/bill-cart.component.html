<div class="bill-items-card">
  <div class="bi-header">
    <h3>Bill Items <span class="bi-count" *ngIf="items.length">({{ items.length }})</span></h3>
  </div>

  <div class="bi-empty" *ngIf="items.length === 0">
    <span>🛒</span>
    <p>No items yet — click <strong>+ Add</strong> on any product above</p>
  </div>

  <div class="bill-row" *ngFor="let item of items; let i = index; trackBy: trackByProduct">
    <span class="br-icon">
      <img *ngIf="item.product.primaryImageUrl" [src]="item.product.primaryImageUrl" class="pr-img" alt="" />
      <span *ngIf="!item.product.primaryImageUrl" class="icon pr-img-fallback">inventory_2</span>
    </span>

    <div class="br-info">
      <span class="br-name">{{ item.product.name }}</span>
      <span class="br-meta">{{ item.product.sku }} · {{ inr(item.unitPrice) }}</span>
      <div class="sn-list" *ngIf="item.serialNumbers?.length">
        <div *ngFor="let sn of item.serialNumbers; let si = index; trackBy: trackByIndex" class="sn-row">
          <div class="sn-field">
            <div class="sn-input-row">
              <input class="f-input sn-input" type="text"
                [class.error]="snErrors[snKey(item, si)]"
                [value]="item.serialNumbers[si]"
                (input)="onSnInput($event, item, si)"
                (blur)="onSnBlur(item, si)"
                [placeholder]="'Serial number ' + (si + 1)" />
              <span class="sn-count" [class.sn-count-max]="(item.serialNumbers[si] || '').length >= snMax">
                {{ (item.serialNumbers[si] || '').length }}/{{ snMax }}
              </span>
            </div>
            <div class="field-error" *ngIf="snErrors[snKey(item, si)]">
              {{ snErrors[snKey(item, si)] }}
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="br-right">
      <div class="qty-ctrl">
        <button (click)="decQty(item)">−</button>
        <input type="number" [(ngModel)]="item.qty" min="1" class="qty-in"
          (change)="onQtyChange(item)" />
        <button (click)="incQty(item)">+</button>
      </div>
      <span class="br-total">{{ inr(lineTotal(item)) }}</span>
      <button class="remove-btn" (click)="removeItem.emit(i)" title="Remove">✕</button>
    </div>
  </div>
</div>
