<ng-container *ngIf="isLoginPage; else shell">
  <router-outlet></router-outlet>
</ng-container>

<ng-template #shell>
  <div class="app-shell" [ngClass]="theme.themeClass()">

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" [class.open]="sidebar.isOpen()" (click)="sidebar.close()"></div>

    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main content -->
    <div class="app-content">
      <div class="ptr-wrap" [style.height.px]="ptrOffset">
        <div class="ptr-icon" [class.ptr-triggered]="ptrTriggered" [class.ptr-loading]="ptrLoading">
          <span class="icon">{{ ptrLoading ? 'refresh' : 'arrow_downward' }}</span>
        </div>
      </div>
      <app-topbar></app-topbar>
      <main class="app-main">
        <router-outlet></router-outlet>
      </main>
    </div>

    <!-- Bottom nav (mobile/tablet only) -->
    <app-bottom-nav></app-bottom-nav>

  </div>
</ng-template>

<!-- Global confirm dialog -->
<app-confirm-dialog></app-confirm-dialog>
