<aside class="adm-aside" [class.open]="sidebar.isOpen()">
  <div class="adm-logo">
    <div class="adm-logo-main">MKR<b>Commerce</b></div>
    <div class="adm-logo-sub">Staff Portal</div>
  </div>

  <nav class="adm-nav">
    <ng-container *ngFor="let group of filteredNavGroups()">
      <div class="nav-grp-lbl">{{ group.label }}</div>
      <ng-container *ngFor="let item of group.items">

        <!-- Regular nav item -->
        <a *ngIf="!item.children"
           class="adm-item"
           [routerLink]="item.route"
           routerLinkActive="on"
           (click)="onNavClick(); closeSubmenu()">
          <span class="adm-item-icon icon" [title]="item.label">{{ item.icon }}</span>
          <span class="adm-item-lbl">{{ item.label }}</span>
          <span *ngIf="item.badge" class="adm-item-badge" [ngClass]="item.badgeClass">{{ item.badge }}</span>
        </a>

        <!-- Submenu trigger -->
        <div *ngIf="item.children"
             class="adm-item adm-item-has-sub"
             #subEl
             [class.on]="isSubmenuActive(item)"
             [title]="item.label"
             (mouseenter)="openSubmenu(item, subEl)"
             (mouseleave)="scheduleClose()"
             (click)="toggleSubmenu(item, subEl); $event.stopPropagation()">
          <span class="adm-item-icon icon">{{ item.icon }}</span>
          <span class="adm-item-lbl">{{ item.label }}</span>
          <span class="icon adm-item-arrow" [class.open]="activeSubmenu === item">chevron_right</span>
        </div>

        <!-- Mobile inline accordion (hidden on desktop/tablet via CSS) -->
        <div class="adm-sub-inline" *ngIf="item.children && activeSubmenu === item">
          <a class="adm-sub-inline-item"
             *ngFor="let c of item.children"
             [routerLink]="c.route"
             routerLinkActive="on"
             (click)="closeSubmenu(); onNavClick()">
            <span class="icon icon-sm">{{ c.icon }}</span>
            <span>{{ c.label }}</span>
          </a>
        </div>

      </ng-container>
    </ng-container>
  </nav>

</aside>

<!-- ── Active indicator bar (position: fixed — never clipped by overflow) ── -->
<div class="adm-active-bar"
     *ngIf="activeBarVisible"
     [style.top.px]="activeBarTop"
     [style.height.px]="activeBarHeight">
</div>

<!-- ── Desktop/Tablet: full-height sub-sidebar panel (hidden on mobile) ── -->
<div class="adm-subsidebar"
     *ngIf="activeSubmenu"
     [style.left.px]="submenuLeft"
     (mouseenter)="cancelClose()"
     (mouseleave)="scheduleClose()">
  <div class="adm-sub-hd">{{ activeSubmenu.label }}</div>
  <a class="adm-sub-item"
     *ngFor="let c of activeSubmenu.children"
     [routerLink]="c.route"
     routerLinkActive="on"
     (click)="closeSubmenu(); onNavClick()">
    <span class="icon icon-sm">{{ c.icon }}</span>
    <span>{{ c.label }}</span>
  </a>
</div>
